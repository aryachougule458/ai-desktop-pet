<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Summon</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
    #btn {
      position: absolute; inset: 4px; border-radius: 50%; background: #fffaf3 center / 82% no-repeat;
      box-shadow: 0 2px 8px rgba(0,0,0,.35), inset 0 0 0 2px #f6a455;
      cursor: grab; transition: transform .12s;
    }
    #btn:hover { transform: scale(1.08); }
    #btn:active { cursor: grabbing; transform: scale(.96); }
  </style>
</head>
<body>
  <div id="btn" title="Click to summon your pet. Drag to move me."></div>
  <script src="button.js"></script>
</body>
</html>
